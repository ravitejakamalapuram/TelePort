# yaml-language-server: $schema=https://raw.githubusercontent.com/ravitejakamalapuram/release-platform/main/schema/release.schema.json
# Releases go through ravitejakamalapuram/release-platform (keyless: GitHub OIDC -> Google WIF).
# Run Actions -> release -> Run workflow. See https://github.com/ravitejakamalapuram/release-platform
#
# chrome-extension/ is not released yet: its Chrome Web Store item
# (oimdkmacklcheogoakhdgilcedkcbikb) has no store state. Add a chrome target once it should ship:
#   - type: chrome
#     item_id: oimdkmacklcheogoakhdgilcedkcbikb
#     path: chrome-extension
app: teleport
test: ./gradlew testDebugUnitTest --no-daemon
targets:
  - type: android
    package: com.carfry369.teleport
    gradle_task: bundleRelease
    aab: app/build/outputs/bundle/release/app-release.aab
    java: '17'
    track: internal
    release_notes: CHANGELOG.md
    ci_task: assembleDebug
    signing:                                 # existing repo secrets use RELEASE_* names
      keystore_base64: RELEASE_KEYSTORE_BASE64
      keystore_password: RELEASE_KEYSTORE_PASSWORD
      key_alias: RELEASE_KEY_ALIAS
      key_password: RELEASE_KEY_PASSWORD
