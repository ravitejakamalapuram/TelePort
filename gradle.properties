# Enable AndroidX and Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Kotlin settings
kotlin.code.style=official

# JVM Heap settings - Reduced to prevent OOM on self-hosted runners
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Suppress compile SDK warnings for API 35
android.suppressUnsupportedCompileSdk=35
