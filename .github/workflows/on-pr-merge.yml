name: On Merge to Main

on:
  push:
    branches:
      - main

jobs:
  automate-release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git log changelog extraction

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Screenshots and Unit Tests
        run: ./gradlew test

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_SHA="${{ github.event.before }}"
          CURR_SHA="${{ github.event.after }}"
          
          # Handle initial push/empty event case
          if [ "$PREV_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$PREV_SHA" ]; then
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$LAST_TAG" ]; then
              COMMIT_RANGE="$LAST_TAG..HEAD"
            else
              COMMIT_RANGE="HEAD~5..HEAD"
            fi
          else
            COMMIT_RANGE="$PREV_SHA..$CURR_SHA"
          fi
          
          echo "Determining changes for range: $COMMIT_RANGE"
          
          # Extract commit list
          CHANGES=$(git log --oneline --pretty=format:"- %s (%h) by %an" $COMMIT_RANGE)
          
          if [ -z "$CHANGES" ]; then
            CHANGES="- Routine maintenance and updates"
          fi
          
          DATE=$(date +"%Y-%m-%d")
          
          # Prep changelog file
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi
          
          # Prepend changes below # Changelog header
          echo "## [$DATE] - Automated Release" > temp_changelog.md
          echo "" >> temp_changelog.md
          echo "$CHANGES" >> temp_changelog.md
          echo "" >> temp_changelog.md
          tail -n +2 CHANGELOG.md >> temp_changelog.md || true
          
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          cat temp_changelog.md >> CHANGELOG.md
          rm temp_changelog.md

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add changelog and screenshots
          git add CHANGELOG.md
          if [ -d "docs/screenshots" ]; then
            git add docs/screenshots/
          fi
          
          # Commit only if there are changes
          git diff-index --quiet HEAD || (git commit -m "docs: auto-update changelog and screenshots [skip ci]" && git push)
