name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Screenshots and Unit Tests
        run: ./gradlew test

      - name: Validate Chrome Extension Manifest
        run: |
          if ! python3 -c "import json; json.load(open('chrome-extension/manifest.json'))"; then
            echo "Error: manifest.json is invalid"
            exit 1
          fi
          echo "Chrome Extension manifest is structurally valid."
