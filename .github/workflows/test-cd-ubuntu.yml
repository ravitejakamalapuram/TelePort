name: Test CD with Ubuntu Runner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-cd:
    name: Test CD Logic on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build debug APK
        run: ./gradlew assembleDebug -x lintVitalAnalyzeRelease -x lintVitalReportRelease
        env:
          versionCode: 999
          versionName: "test-1.0.0"
      
      - name: List build outputs
        run: |
          echo "Build outputs:"
          find app/build/outputs -type f -name "*.apk" || true
          
      - name: Check Chrome Extension
        run: |
          if [ -f chrome-extension/manifest.json ]; then
            echo "✅ Chrome Extension found"
            cd chrome-extension
            zip -r ../teleport-extension-test.zip . -x "*.git*"
            echo "✅ Extension packaged"
          else
            echo "❌ No Chrome Extension"
          fi
